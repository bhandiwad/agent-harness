[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pandita-agent"
version = "0.5.0"
description = "Independent generic agent sessions, controlled tools and durable approvals"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3", "httpx2>=2,<3", "fastapi>=0.130,<1", "uvicorn>=0.40,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "casbin>=1.43,<2", "jsonschema>=4.25,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
pandita-agent = "pandita_agent.agent.main:main"
pandita-agent-context-probe = "pandita_agent.agent.context_probe:main"
pandita-agent-sandbox = "pandita_agent.agent.sandbox:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pandita_agent.agent" = ["web/*.html", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
